# Builds the view-only Viewer and deploys it to GitHub Pages on every
# push to main. The site is a build product: it is not committed.
#
# GitHub → Settings → Pages → Build and deployment → Source: GitHub Actions.
#
# The install ref is pinned on purpose. Bump it when the published page
# should pick up a change in system-explorer; a later Explorer commit does
# nothing here until this line moves. Replace @main with a commit SHA once
# the --publish command is on that commit.
name: Publish Viewer

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system-explorer
        run: pip install "git+https://github.com/PatrykPrezyna/SE_assistant.git@main"
      - name: Publish the Viewer
        run: system-explorer . --publish _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
